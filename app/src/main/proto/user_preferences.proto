syntax = "proto3";

import "auth_status.proto";
import "role_status.proto";

option java_package = "bob.colbaskin.stoq.datastore";
option java_multiple_files = true;

message UserPreferencesProto {
  AuthStatus auth_status = 1;
  RoleStatus role_status = 2;
  string user_id = 3;
  string user_name = 4;
  string user_email = 5;
  string encrypted_session = 6;
  int64 restaurant_id = 7;
  string restaurant_name = 8;
  string restaurant_address = 9;
  string restaurant_email = 10;
  string restaurant_phone = 11;
  string user_avatar_url = 12;
}
